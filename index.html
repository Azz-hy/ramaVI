<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KSECS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="bg-grid"></div>
  <div class="progress-bar" id="progress-bar"></div>

  <header class="site-header">
    <div class="header-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand" id="brand-text">KSECS</span>
    </div>
    <div class="header-right">
      <span class="watch-progress" id="watch-progress"></span>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle section list">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="nav-toggle-label">Sections</span>
      </button>
    </div>
  </header>

  <div class="toc-backdrop" id="toc-backdrop"></div>
  <nav class="toc" id="toc">
    <div class="toc-head">
      <span>Contents</span>
      <button class="toc-close" id="toc-close" aria-label="Close section list">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="toc-inner" id="toc-inner"></div>
  </nav>

  <main>
    <!-- Cover -->
    <section class="cover" id="cover">
      <span class="confidential-badge" id="confidential-badge"></span>
      <p class="kicker" id="cover-kicker"></p>
      <h1 class="cover-title" id="cover-title-en"></h1>
      <p class="cover-title-ku" id="cover-title-ku" dir="rtl"></p>
      <p class="cover-subtitle" id="cover-subtitle"></p>

      <div class="cover-stats" id="cover-stats"></div>

      <div class="cover-meta">
        <div class="meta-row">
          <span class="meta-label">Presented to</span>
          <span class="meta-value" id="presented-to"></span>
        </div>
        <div class="meta-row">
          <span class="meta-label">Presented by</span>
          <span class="meta-value" id="presented-by"></span>
        </div>
        <div class="meta-row">
          <span class="meta-label">Date</span>
          <span class="meta-value" id="cover-date"></span>
        </div>
      </div>

      <button class="cta-button" id="cover-cta">
        <span id="cover-cta-label">Begin the Presentation</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M19 12l-7 7-7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </section>

    <!-- Main sections are rendered here by main.js -->
    <div id="sections-root"></div>

    <!-- Appendices -->
    <section class="appendix-section" id="appendix-section">
      <h3 class="group-heading">Appendices</h3>
      <div id="appendices-root"></div>
    </section>

    <!-- Documentaries -->
    <section class="documentary-section" id="documentary-section">
      <h3 class="group-heading">Documentaries</h3>
      <div id="documentaries-root"></div>
    </section>

    <!-- References -->
    <section class="references-section" id="references-section">
      <button class="references-toggle" id="references-toggle">
        <h3 id="references-heading">Sources &amp; References</h3>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p class="references-note" id="references-note"></p>
      <div class="references-body" id="references-body" hidden></div>
    </section>

    <!-- Closing -->
    <section class="closing-section" id="closing-section">
      <h2 id="closing-title"></h2>
      <p id="closing-message"></p>
      <div class="closing-meta">
        <span id="closing-by"></span>
        <span id="closing-tel"></span>
        <span id="closing-date"></span>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Prepared as a strategic and technical proposal. Confidential.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
